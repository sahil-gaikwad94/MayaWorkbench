[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mayaworkbench"
version = "0.1.0"
description = "MayaWorkbench: an evidence-first research-engineering workbench for existing AI/ML repositories."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "MayaWorkbench" }]
keywords = ["research", "reproducibility", "repository-intelligence", "ai", "ml"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  # Schema validation for versioned domain/contract/output models.
  # Used for: persisted domain records, exported JSON schemas, and strict
  # validation of model-generated structured output in later phases.
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Better PDF text extraction (font encodings and ToUnicode maps). The builtin
# parser remains the fallback when this extra is not installed.
pdf = ["pypdf>=4.0,<6"]
# Real concrete-syntax-tree parsing for non-Python languages. The indexer keeps
# the bounded regex adapter (LOW / HEURISTIC) when these are not installed.
treesitter = ["tree-sitter>=0.23", "tree-sitter-language-pack>=0.6"]
# Optional numerical acceleration for dense-vector providers. The core install
# and the deterministic hashing adapter do not need numpy.
embeddings = ["numpy>=1.26"]

[project.scripts]
maya = "mayaworkbench.cli.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mayaworkbench = ["py.typed", "api/ui/index.html"]
"mayaworkbench.storage.migrations" = ["*.sql"]
"mayaworkbench.evaluation" = ["gold/causal_attention_seed.json", "gold/eval_tasks_seed.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "oci: real rootless-OCI escape harness; runs only with MAYA_OCI_LIVE=1 and a verified runtime",
  "live_model: real provider harness; runs only with MAYA_LIVE_MODEL=1, an API key and a hard spend cap",
]

[tool.ruff]
line-length = 100
target-version = "py311"
