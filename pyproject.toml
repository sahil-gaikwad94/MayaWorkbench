[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mayaworkbench"
version = "0.1.0"
description = "MayaWorkbench: an evidence-first research-engineering workbench for existing AI/ML repositories."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "MayaWorkbench" }]
keywords = ["research", "reproducibility", "repository-intelligence", "ai", "ml"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  # Schema validation for versioned domain/contract/output models.
  # Used for: persisted domain records, exported JSON schemas, and strict
  # validation of model-generated structured output in later phases.
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
maya = "mayaworkbench.cli.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mayaworkbench = ["py.typed"]
"mayaworkbench.storage.migrations" = ["*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
